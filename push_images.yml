- name: Pull, Scan, and Push Ubuntu 24.04
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    image_name: ubuntu
    image_tag: "24.04"
    dockerhub_repo: "{{ lookup('env', 'DOCKERHUB_USER') }}"
    build_tag: "{{ lookup('env', 'IMAGE_TAG') }}"

  pre_tasks:
    - name: Validate required environment variables
      ansible.builtin.fail:
        msg: "Required environment variable '{{ item.name }}' is not set or empty"
      when: item.value == ""
      loop:
        - { name: "DOCKERHUB_USER", value: "{{ dockerhub_repo }}" }
        - { name: "IMAGE_TAG",      value: "{{ build_tag }}" }

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ lookup('env', 'DOCKERHUB_USER') }}"
        password: "{{ lookup('env', 'DOCKERHUB_PASS') }}"

    - name: Pull Ubuntu 24.04
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Run Trivy scan using persistent container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - trivy-container
          - trivy
          - image
          - --format
          - json
          - --output
          - /tmp/trivy_raw.json
          - --exit-code
          - "0"
          - "{{ image_name }}:{{ image_tag }}"
      changed_when: false

    - name: Copy scan result from Trivy container to host
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - trivy-container:/tmp/trivy_raw.json
          - /tmp/trivy_raw.json
      changed_when: false

    - name: Convert Trivy JSON to per-severity CSV files
      ansible.builtin.shell: |
        python3 - <<'EOF'
        import json, csv

        with open("/tmp/trivy_raw.json") as f:
            data = json.load(f)

        buckets = {"CRITICAL": [], "HIGH": [], "MEDIUM": [], "LOW": [], "UNKNOWN": []}

        for result in data.get("Results", []):
            target = result.get("Target", "")
            for vuln in result.get("Vulnerabilities") or []:
                sev = vuln.get("Severity", "UNKNOWN")
                bucket = buckets.get(sev, buckets["UNKNOWN"])
                bucket.append({
                    "VulnerabilityID":  vuln.get("VulnerabilityID", ""),
                    "PkgName":          vuln.get("PkgName", ""),
                    "InstalledVersion": vuln.get("InstalledVersion", ""),
                    "FixedVersion":     vuln.get("FixedVersion", ""),
                    "Title":            vuln.get("Title", ""),
                    "Target":           target,
                })

        fields = ["VulnerabilityID", "PkgName", "InstalledVersion",
                  "FixedVersion", "Title", "Target"]

        counts = {}
        for sev, rows in buckets.items():
            counts[sev] = len(rows)
            if not rows:
                continue
            filename = f"output_{sev.lower()}.csv"
            with open(filename, "w", newline="") as f:
                writer = csv.DictWriter(f, fieldnames=fields)
                writer.writeheader()
                writer.writerows(rows)

        print(json.dumps(counts))
        EOF
      register: csv_counts
      changed_when: false

    - name: Show vulnerability summary
      ansible.builtin.debug:
        msg: "Scan complete — counts by severity: {{ csv_counts.stdout }}"

    - name: Fail pipeline if CRITICAL vulnerabilities found
      ansible.builtin.fail:
        msg: "CRITICAL vulnerabilities detected — refusing to push. Check output_critical.csv"
      when: (csv_counts.stdout | from_json).get('CRITICAL', 0) | int > 0

    - name: Debug tagging info
      ansible.builtin.debug:
        msg: "Tagging {{ image_name }}:{{ image_tag }} as {{ dockerhub_repo }}/{{ image_name }}:{{ build_tag }}"

    - name: Tag and Push Ubuntu image to Docker Hub
      community.docker.docker_image:
        name: "{{ image_name }}:{{ image_tag }}"
        repository: "{{ dockerhub_repo }}/{{ image_name }}"
        tag: "{{ build_tag }}"
        source: local
        push: true

  post_tasks:
    - name: Log out from Docker Hub
      community.docker.docker_login:
        state: absent
